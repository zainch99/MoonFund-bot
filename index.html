<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonFund Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .user-box {
            background: rgba(56, 189, 248, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #38bdf8;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 MoonFund Dashboard</h1>
        <p>Solana Meme Coin Prop Evaluation</p>
        
        <div class="user-box" id="user-greeting">
            Loading User Data...
        </div>

        <button class="btn" onclick="Telegram.WebApp.showAlert('Evaluation Dashboard Coming Soon!')">
            View Evaluation Packages
        </button>
    </div>

    <script>
        // Telegram WebApp Initialize
        const tg = window.Telegram.WebApp;
        tg.expand(); // Full screen expanded

        // Fetch User Info from Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-greeting').innerText = `Welcome, @${user.username || user.first_name}!`;
        } else {
            document.getElementById('user-greeting').innerText = "Welcome, Trader!";
        }
    </script>
</body>
</html>
