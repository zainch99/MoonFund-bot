<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoonFund Evaluation Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 6px;
            user-select: none;
        }
        .header { text-align: center; margin-bottom: 6px; }
        .header h1 { color: #38bdf8; font-size: 16px; margin: 0; }
        .user-greeting {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            margin-top: 2px;
        }
        .test-bypass-btn {
            background-color: #f59e0b;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
        }
        .card {
            background: #151c2c;
            border: 1px solid #243049;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-title { font-size: 14px; font-weight: bold; color: #f8fafc; }
        .card-price { background: #0284c7; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .rules { font-size: 11px; color: #94a3b8; line-height: 1.4; margin-bottom: 8px; }
        .rules span { color: #e2e8f0; font-weight: 600; }
        .btn { background-color: #10b981; color: #000; border: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%; }

        /* COMPACT LIVE STATS HEADER */
        .compact-stats-bar {
            background: #151c2c;
            border: 1px solid #243049;
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .stat-item { display: flex; flex-direction: column; text-align: center; }
        .stat-lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .stat-val { font-weight: bold; color: #38bdf8; font-size: 12px; margin-top: 1px; }

        .reload-chart-btn {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* TRADE STATUS BANNER */
        .trade-status-banner {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 5px;
            border-radius: 4px;
            margin-bottom: 6px;
            background: #1e293b;
            color: #38bdf8;
        }

        /* DEX CONTAINER */
        .dex-frame-container {
            width: 100%;
            height: calc(100vh - 160px);
            min-height: 400px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #243049;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }
        iframe {
            width: 100%;
            height: calc(100% + 38px);
            border: none;
        }

        /* HARD OVERLAY FIXED BUTTONS (HIJACK PROTECTION) */
        .trade-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; 
            position: relative;
            z-index: 99999;
            background: #0b0f19;
            padding-top: 2px;
        }
        .action-btn { 
            border: none; 
            padding: 14px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
            width: 100%;
            display: block;
            pointer-events: auto !important;
        }
        .buy-style { background: #10b981; color: #000; }
        .sell-style { background: #ef4444; color: #fff; }
        .action-btn:active { opacity: 0.5; transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- SECTION 1: PACKAGES LANDING -->
    <div id="landing-view">
        <div class="header">
            <h1>🚀 MoonFund Evaluation</h1>
            <div class="user-greeting" id="user-greeting">Trader</div>
        </div>

        <button class="test-bypass-btn" id="btn-bypass">⚡ Test Bypass (Activate Terminal)</button>

        <div class="card">
            <div class="card-header">
                <span class="card-title">Micro Mooner ($1,000)</span>
                <span class="card-price">$15</span>
            </div>
            <div class="rules">
                • Target: <span>$100 (10%)</span> | Max Loss: <span>5% ($950 Stop)</span><br>
                • Engine: <span>Direct Hardware Touch Binding</span>
            </div>
            <button class="btn" id="btn-challenge">Buy $1,000 Challenge</button>
        </div>
    </div>

    <!-- SECTION 2: TERMINAL -->
    <div id="dashboard-view" style="display:none;">
        
        <div class="compact-stats-bar">
            <button class="reload-chart-btn" id="btn-reset-dex">← Tokens</button>
            <div class="stat-item">
                <span class="stat-lbl">Equity</span>
                <span class="stat-val" id="val-equity">$1,000.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-lbl">Hard Stop</span>
                <span class="stat-val" id="val-stop" style="color: #ef4444;">$950.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-lbl">Target</span>
                <span class="stat-val" id="val-target" style="color: #10b981;">$1,100.00</span>
            </div>
        </div>

        <div class="trade-status-banner" id="status-banner">Ready to Trade</div>

        <div class="dex-frame-container">
            <iframe id="dex-iframe" src="https://dexscreener.com/solana?embed=1&theme=dark&trades=0&info=0"></iframe>
        </div>

        <div class="trade-grid">
            <button class="action-btn buy-style" id="btn-trade-buy">BUY</button>
            <button class="action-btn sell-style" id="btn-trade-sell">SELL</button>
        </div>
    </div>

    <script>
        // Force flush localstorage if corrupted state exists
        let account = { initialBalance: 1000, equity: 1000, target: 1100, hardStop: 950, status: "ACTIVE" };

        function attachEvents() {
            const bindAction = (id, fn) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); }, { passive: false });
                el.addEventListener('click', (e) => { e.preventDefault(); fn(); });
            };

            bindAction('btn-bypass', () => launchDashboard(1000));
            bindAction('btn-challenge', () => launchDashboard(1000));
            bindAction('btn-reset-dex', resetDexList);
            bindAction('btn-trade-buy', () => processTrade('BUY'));
            bindAction('btn-trade-sell', () => processTrade('SELL'));
        }

        window.onload = function() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.expand();
                    const u = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (u) document.getElementById('user-greeting').innerText = `@${u.username || u.first_name}`;
                }
            } catch(e){}

            attachEvents();

            const savedSession = localStorage.getItem('moonfund_active_session');
            if (savedSession) {
                try {
                    account = JSON.parse(savedSession);
                    showDashboardUI();
                } catch(e) {
                    localStorage.removeItem('moonfund_active_session');
                }
            }
        };

        function resetDexList() {
            document.getElementById('dex-iframe').src = "https://dexscreener.com/solana?embed=1&theme=dark&trades=0&info=0";
        }

        function launchDashboard(creditAmount) {
            account = {
                initialBalance: creditAmount,
                equity: creditAmount,
                target: creditAmount * 1.10,
                hardStop: creditAmount * 0.95,
                status: "ACTIVE"
            };

            localStorage.setItem('moonfund_active_session', JSON.stringify(account));
            showDashboardUI();
        }

        function showDashboardUI() {
            document.getElementById('landing-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            setupBackButton();
            renderStats();
        }

        function setupBackButton() {
            window.history.pushState({ page: 'terminal' }, '', '');
            window.onpopstate = function () {
                resetDexList();
                window.history.pushState({ page: 'terminal' }, '', '');
            };

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.BackButton) {
                window.Telegram.WebApp.BackButton.show();
                window.Telegram.WebApp.BackButton.onClick(() => { resetDexList(); });
            }
        }

        function renderStats(pnl = null, type = '') {
            document.getElementById('val-equity').innerText = `$${account.equity.toFixed(2)}`;
            document.getElementById('val-stop').innerText = `$${account.hardStop.toFixed(2)}`;
            document.getElementById('val-target').innerText = `$${account.target.toFixed(2)}`;

            const banner = document.getElementById('status-banner');

            if (pnl !== null) {
                const isWin = pnl >= 0;
                banner.innerText = `${type} EXECUTED: ${isWin ? '+' : ''}$${pnl.toFixed(2)}`;
                banner.style.color = isWin ? '#10b981' : '#ef4444';
            }

            localStorage.setItem('moonfund_active_session', JSON.stringify(account));

            if (account.equity <= account.hardStop) {
                account.status = "TERMINATED";
                banner.innerText = "🚨 HARD STOP BREACHED! RESETTING...";
                banner.style.color = "#ef4444";
                setTimeout(() => {
                    localStorage.removeItem('moonfund_active_session');
                    location.reload();
                }, 1200);
            } else if (account.equity >= account.target) {
                account.status = "PASSED";
                banner.innerText = "🏆 TARGET REACHED! EVALUATION PASSED!";
                banner.style.color = "#10b981";
            }
        }

        function processTrade(type) {
            if (account.status !== "ACTIVE") return;

            // Direct guaranteed calculation change
            let pnl = type === 'BUY' ? (Math.random() * 30 - 10) : (Math.random() * 30 - 12);
            account.equity += pnl;

            renderStats(pnl, type);
        }
    </script>
</body>
</html>
