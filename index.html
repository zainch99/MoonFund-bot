<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
        document.getElementById('user-greeting').innerText = `@${user.username || user.first_name}`;
    } else {
        document.getElementById('user-greeting').innerText = "Trader";
    }

    function selectPackage(name, fee) {
        // Send selected plan data back to the Telegram Bot
        tg.sendData(JSON.stringify({
            action: "buy_package",
            package_name: name,
            fee_usd: fee
        }));
        
        tg.close(); // Close the Web App window after selection
    }
</script>
