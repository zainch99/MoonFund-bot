<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonFund Evaluation Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 6px;
        }
        .header { text-align: center; margin-bottom: 6px; }
        .header h1 { color: #38bdf8; font-size: 16px; margin: 0; }
        .user-greeting {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            margin-top: 2px;
        }
        .test-bypass-btn {
            background-color: #f59e0b;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
        }
        .card {
            background: #151c2c;
            border: 1px solid #243049;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-title { font-size: 14px; font-weight: bold; color: #f8fafc; }
        .card-price { background: #0284c7; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .rules { font-size: 11px; color: #94a3b8; line-height: 1.4; margin-bottom: 8px; }
        .rules span { color: #e2e8f0; font-weight: 600; }
        .btn { background-color: #10b981; color: #000; border: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%; }

        /* COMPACT LIVE STATS HEADER WITH INNER BACK BUTTON */
        .compact-stats-bar {
            background: #151c2c;
            border: 1px solid #243049;
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 6px;
        }
        .stat-item { display: flex; flex-direction: column; text-align: center; }
        .stat-lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .stat-val { font-weight: bold; color: #38bdf8; font-size: 12px; margin-top: 1px; }

        .reload-chart-btn {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* DEX CONTAINER */
        .dex-frame-container {
            width: 100%;
            height: calc(100vh - 120px);
            min-height: 480px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #243049;
            margin-bottom: 6px;
            position: relative;
        }
        iframe {
            width: 100%;
            height: calc(100% + 38px);
            border: none;
        }

        .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .trade-btn { background: #10b981; color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .sell-btn { background: #ef4444; color: #fff; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #151c2c; border: 1px solid #38bdf8; border-radius: 12px; padding: 20px; text-align: center; width: 100%; max-width: 320px; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; margin-top: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- SECTION 1: PACKAGES LANDING -->
    <div id="landing-view">
        <div class="header">
            <h1>🚀 MoonFund Evaluation</h1>
            <div class="user-greeting" id="user-greeting">Loading...</div>
        </div>

        <button class="test-bypass-btn" onclick="launchDashboard(1000)">⚡ Test Bypass (Activate Terminal)</button>

        <div class="card">
            <div class="card-header">
                <span class="card-title">Micro Mooner ($1,000)</span>
                <span class="card-price">$15</span>
            </div>
            <div class="rules">
                • Target: <span>$100 (10%)</span> | Max Loss: <span>5%</span><br>
                • Trailing Stop: <span>10% from Peak</span> | Penalty: <span>5% Slippage</span>
            </div>
            <button class="btn" onclick="openPayment('Micro Mooner', 15, 1000)">Buy $1,000 Challenge</button>
        </div>
    </div>

    <!-- SECTION 2: FULL DEX TERMINAL (PERSISTENT ACTIVE SESSION) -->
    <div id="dashboard-view" style="display:none;">
        
        <!-- COMPACT STATUS LINE + DEX LIST RESET BUTTON -->
        <div class="compact-stats-bar">
            <button class="reload-chart-btn" onclick="resetDexList()" title="Back to All Coins">← Tokens</button>
            <div class="stat-item">
                <span class="stat-lbl">Equity</span>
                <span class="stat-val" id="val-equity">$1,000.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-lbl">Hard Stop</span>
                <span class="stat-val" id="val-stop" style="color: #ef4444;">$900.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-lbl">Target</span>
                <span class="stat-val" id="val-target" style="color: #10b981;">$1,100.00</span>
            </div>
        </div>

        <!-- DEXSCREENER CLEAN CONTAINER -->
        <div class="dex-frame-container">
            <iframe id="dex-iframe" src="https://dexscreener.com/solana?embed=1&theme=dark&trades=0&info=0"></iframe>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="trade-grid">
            <button class="trade-btn" onclick="executeTrade('BUY')">BUY (5% Fee)</button>
            <button class="trade-btn sell-btn" onclick="executeTrade('SELL')">SELL (5% Fee)</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let account = { initialBalance: 1000, equity: 1000, highWaterMark: 1000, target: 1100, status: "ACTIVE" };

        const user = tg.initDataUnsafe?.user;
        document.getElementById('user-greeting').innerText = user ? `@${user.username || user.first_name}` : "Trader";

        // APP INITIALIZATION: Check if session is already paid/active
        window.onload = function() {
            const savedSession = localStorage.getItem('moonfund_active_session');
            if (savedSession) {
                account = JSON.parse(savedSession);
                showDashboardUI();
            }
        };

        function resetDexList() {
            document.getElementById('dex-iframe').src = "https://dexscreener.com/solana?embed=1&theme=dark&trades=0&info=0";
        }

        function launchDashboard(creditAmount) {
            account.initialBalance = creditAmount;
            account.equity = creditAmount;
            account.highWaterMark = creditAmount;
            account.target = creditAmount * 1.10;
            account.status = "ACTIVE";

            // Save Active Paid State
            localStorage.setItem('moonfund_active_session', JSON.stringify(account));
            showDashboardUI();
        }

        function showDashboardUI() {
            document.getElementById('landing-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            
            // Hide Telegram native BackButton so paid users don't exit to landing
            tg.BackButton.hide();
            updateDashboardUI();
        }

        function updateDashboardUI() {
            const stopLimit = account.highWaterMark * 0.90;
            document.getElementById('val-equity').innerText = `$${account.equity.toFixed(2)}`;
            document.getElementById('val-stop').innerText = `$${stopLimit.toFixed(2)}`;
            document.getElementById('val-target').innerText = `$${account.target.toFixed(2)}`;

            // Persist state updates
            localStorage.setItem('moonfund_active_session', JSON.stringify(account));

            if (account.equity <= stopLimit) {
                account.status = "TERMINATED";
                alert("CRITICAL BREACH: Trailing Drawdown Hit! Account Terminated.");
                localStorage.removeItem('moonfund_active_session');
                location.reload();
            } else if (account.equity >= account.target) {
                account.status = "PASSED";
                alert("CONGRATULATIONS! Target Passed.");
            }
        }

        function executeTrade(type) {
            if (account.status !== "ACTIVE") {
                alert("Account is not active.");
                return;
            }

            let marketMove = (Math.random() * 0.27) - 0.12;
            let netOutcome = marketMove - 0.05;

            account.equity += (account.equity * netOutcome);

            if (account.equity > account.highWaterMark) {
                account.highWaterMark = account.equity;
            }

            updateDashboardUI();
        }

        function openPayment(pkg, fee, credit) {
            launchDashboard(credit); // Automated activation for testing session flow
        }
    </script>
</body>
</html>
