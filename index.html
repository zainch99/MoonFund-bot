<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoonFund Evaluation Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 6px;
            user-select: none;
        }
        .header { text-align: center; margin-bottom: 6px; }
        .header h1 { color: #38bdf8; font-size: 16px; margin: 0; }
        .user-greeting {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            margin-top: 2px;
        }
        .test-bypass-btn {
            background-color: #f59e0b;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
        }
        .card {
            background: #151c2c;
            border: 1px solid #243049;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-title { font-size: 14px; font-weight: bold; color: #f8fafc; }
        .card-price { background: #0284c7; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .rules { font-size: 11px; color: #94a3b8; line-height: 1.4; margin-bottom: 8px; }
        .rules span { color: #e2e8f0; font-weight: 600; }
        .btn { background-color: #10b981; color: #000; border: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%; }

        /* COMPACT LIVE STATS HEADER */
        .compact-stats-bar {
            background: #151c2c;
            border: 1px solid #243049;
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .stat-item { display: flex; flex-direction: column; text-align: center; }
        .stat-lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .stat-val { font-weight: bold; color: #38bdf8; font-size: 12px; margin-top: 1px; transition: color 0.2s; }

        .reload-chart-btn {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* TRADE STATUS BANNER */
        .trade-status-banner {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            background: #1e293b;
            color: #38bdf8;
        }

        /* DEX CONTAINER (Hides "Tracked by DexScreener") */
        .dex-frame-container {
            width: 100%;
            height: calc(100vh - 170px);
            min-height: 380px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #243049;
            margin-bottom: 6px;
            position: relative;
        }
        iframe {
            width: 100%;
            height: calc(100% + 38px); /* Hides bottom attribution bar */
            border: none;
        }

        .trade-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; 
        }
        .action-btn { 
            border: none; 
            padding: 14px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
            width: 100%;
        }
        .buy-style { background: #10b981; color: #000; }
        .sell-style { background: #ef4444; color: #fff; }
        .reset-btn { background: #f59e0b; color: #000; margin-top: 6px; display: none; }
    </style>
</head>
<body>

    <!-- SECTION 1: PACKAGES LANDING -->
    <div id="landing-view">
        <div class="header">
            <h1>🚀 MoonFund Evaluation</h1>
            <div class="user-greeting" id="user-greeting">Trader</div>
        </div>

        <button class="test-bypass-btn" onclick="launchDashboard(1000)">⚡ Test Bypass (Activate Terminal)</button>

        <div class="card">
            <div class="card-header">
                <span class="card-title">Micro Mooner ($1,000)</span>
                <span class="card-price">$15</span>
            </div>
            <div class="rules">
                • Target: <span>$100 (10%)</span> | Max Loss: <span>5% ($950 Stop)</span><br>
                • Rules: <span>Realistic Trend Engine</span>
            </div>
            <button class="btn" onclick="launchDashboard(1000)">Buy $1,000 Challenge</button>
        </div>
    </div>

    <!-- SECTION 2: TERMINAL -->
    <div id="dashboard-view" style="display:none;">
        
        <div class="compact-stats-bar">
            <button class="reload-chart-btn" onclick="goBackOrResetDex()">← Tokens</button>
            <div class="stat-item">
                <span class="stat-lbl">Equity</span>
                <span class="stat-val" id="val-equity">$1,000.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-lbl">Hard Stop</span>
                <span class="stat-val" id="val-stop" style="color: #ef4444;">$950.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-lbl">Target</span>
                <span class="stat-val" id="val-target" style="color: #10b981;">$1,100.00</span>
            </div>
        </div>

        <div class="trade-status-banner" id="status-banner">Ready to Trade</div>

        <div class="dex-frame-container">
            <iframe id="dex-iframe" src="https://dexscreener.com/solana?embed=1&theme=dark&trades=0&info=0"></iframe>
        </div>

        <div class="trade-grid">
            <button class="action-btn buy-style" id="btn-buy" onclick="processTrade('BUY')">BUY (LONG)</button>
            <button class="action-btn sell-style" id="btn-sell" onclick="processTrade('SELL')">SELL (SHORT)</button>
        </div>
        <button class="action-btn reset-btn" id="btn-reset-session" onclick="forceResetSession()">🔄 Reset Test Account</button>
    </div>

    <script>
        const DEFAULT_DEX_URL = "https://dexscreener.com/solana?embed=1&theme=dark&trades=0&info=0";
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let account = { 
            initialBalance: 1000, 
            equity: 1000, 
            target: 1100, 
            hardStop: 950, 
            status: "ACTIVE",
            currentTrend: 1
        };

        window.onload = function() {
            if (tg && tg.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                document.getElementById('user-greeting').innerText = `@${u.username || u.first_name}`;
            }

            const savedSession = localStorage.getItem('moonfund_active_session');
            if (savedSession) {
                try {
                    account = JSON.parse(savedSession);
                    showDashboardUI();
                } catch(e) {
                    forceResetSession();
                }
            }
        };

        function resetDexList() {
            document.getElementById('dex-iframe').src = DEFAULT_DEX_URL;
        }

        function goBackOrResetDex() {
            const iframe = document.getElementById('dex-iframe');
            // If user opened a specific token chart, go back to token list first
            if (iframe.src !== DEFAULT_DEX_URL) {
                resetDexList();
            } else {
                // Otherwise go back to landing screen
                showLandingUI();
            }
        }

        function forceResetSession() {
            localStorage.removeItem('moonfund_active_session');
            location.reload();
        }

        function launchDashboard(creditAmount) {
            account = {
                initialBalance: creditAmount,
                equity: creditAmount,
                target: creditAmount * 1.10,
                hardStop: creditAmount * 0.95,
                status: "ACTIVE",
                currentTrend: 1
            };

            localStorage.setItem('moonfund_active_session', JSON.stringify(account));
            showDashboardUI();
        }

        function showDashboardUI() {
            document.getElementById('landing-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            setupBackButton();
            renderStats();
        }

        function showLandingUI() {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('landing-view').style.display = 'block';
            if (tg && tg.BackButton) tg.BackButton.hide();
        }

        function setupBackButton() {
            window.history.pushState({ page: 'terminal' }, '', '');
            window.onpopstate = function () {
                goBackOrResetDex();
                window.history.pushState({ page: 'terminal' }, '', '');
            };

            if (tg && tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => { goBackOrResetDex(); });
            }
        }

        function renderStats(pnl = null, type = '') {
            const equityEl = document.getElementById('val-equity');
            equityEl.innerText = `$${account.equity.toFixed(2)}`;
            document.getElementById('val-stop').innerText = `$${account.hardStop.toFixed(2)}`;
            document.getElementById('val-target').innerText = `$${account.target.toFixed(2)}`;

            const banner = document.getElementById('status-banner');
            const resetBtn = document.getElementById('btn-reset-session');

            if (pnl !== null) {
                const isWin = pnl >= 0;
                banner.innerText = `${type} ORDER: ${isWin ? '+' : ''}$${pnl.toFixed(2)}`;
                banner.style.color = isWin ? '#10b981' : '#ef4444';
                
                equityEl.style.color = isWin ? '#10b981' : '#ef4444';
                setTimeout(() => { equityEl.style.color = '#38bdf8'; }, 300);
            }

            localStorage.setItem('moonfund_active_session', JSON.stringify(account));

            if (account.equity <= account.hardStop) {
                account.status = "TERMINATED";
                banner.innerText = "🚨 MAX LOSS HIT ($950)! ACCOUNT TERMINATED.";
                banner.style.color = "#ef4444";
                resetBtn.style.display = "block";
            } else if (account.equity >= account.target) {
                account.status = "PASSED";
                banner.innerText = "🏆 TARGET REACHED ($1100)! EVALUATION PASSED!";
                banner.style.color = "#10b981";
                resetBtn.style.display = "block";
            } else {
                resetBtn.style.display = "none";
            }
        }

        function processTrade(type) {
            if (account.status !== "ACTIVE") {
                forceResetSession();
                return;
            }

            // TREND-BASED REALISTIC LOGIC
            let pnl = 0;
            let isPositiveTrend = (type === 'BUY');

            if (Math.random() < 0.25) {
                isPositiveTrend = !isPositiveTrend;
            }

            if (isPositiveTrend) {
                pnl = +(Math.random() * 18 + 5).toFixed(2); // Consistent Profit +$5 to +$23
            } else {
                pnl = -(Math.random() * 10 + 3).toFixed(2); // Managed Loss -$3 to -$13
            }

            account.equity = +(account.equity + pnl).toFixed(2);
            renderStats(pnl, type);
        }
    </script>
</body>
</html>
