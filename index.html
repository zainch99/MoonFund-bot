<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MoonFund Evaluation</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151a23;
      --border: #232a36;
      --text: #e1e7ef;
      --text-muted: #7b889b;
      --accent: #6366f1;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Stats Header */
    .header-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .stat-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 700;
    }

    /* Main Container */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
    }

    /* DexScreener Chart Frame */
    .chart-container {
      width: 100%;
      height: 320px;
      position: relative;
      border-bottom: 1px solid var(--border);
      background: #000;
    }

    .chart-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Challenge & Status Card */
    .challenge-card {
      margin: 12px;
      padding: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .badge-active { background: rgba(99, 102, 241, 0.2); color: var(--accent); }
    .badge-passed { background: rgba(16, 185, 129, 0.2); color: var(--green); }
    .badge-terminated { background: rgba(239, 68, 68, 0.2); color: var(--red); }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    /* Active Position Card */
    .position-card {
      margin: 0 12px 12px 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    .pos-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .pos-row:last-child {
      margin-bottom: 0;
    }

    /* Controls Bar */
    .controls-footer {
      padding: 12px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-buy { background: var(--green); color: #fff; }
    .btn-close { background: var(--red); color: #fff; }
    .btn-reset { background: var(--border); color: var(--text); flex: 0.4; }

    .pnl-positive { color: var(--green); }
    .pnl-negative { color: var(--red); }
  </style>
</head>
<body>

  <!-- Top Stats Header -->
  <div class="header-stats">
    <div class="stat-card">
      <span class="stat-label">Hard Stop</span>
      <span class="stat-value" style="color: var(--red);">$950.00</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Equity</span>
      <span class="stat-value" id="ui-equity">$1,000.00</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Target</span>
      <span class="stat-value" style="color: var(--green);">$1,100.00</span>
    </div>
  </div>

  <!-- Main Scrollable Body -->
  <div class="main-container">
    <!-- Chart Widget (Solana Pair via DexScreener) -->
    <div class="chart-container">
      <iframe src="https://dexscreener.com/solana/4k3Dyjzvzp8eMZWUXbBCjEvwSkkk59S5iCNLY3QrkX6R?embed=1&theme=dark&trades=0&info=0"></iframe>
    </div>

    <!-- Challenge Overview Card -->
    <div class="challenge-card">
      <div class="card-title-row">
        <span class="card-title">$1,000 MoonFund Challenge</span>
        <span class="status-badge badge-active" id="ui-status">ACTIVE</span>
      </div>
      <div class="pos-row">
        <span style="color: var(--text-muted);">Evaluation Progress</span>
        <span id="ui-progress-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="ui-progress-bar"></div>
      </div>
    </div>

    <!-- Active Position Widget -->
    <div class="position-card" id="ui-pos-card">
      <div class="pos-row">
        <span>Token Price: <strong id="ui-token-price">$0.000000</strong></span>
        <span>Position: <strong id="ui-pos-status" style="color: var(--text-muted);">NONE</strong></span>
      </div>
      <div class="pos-row">
        <span>Entry Price: <span id="ui-pos-entry">-</span></span>
        <span>Floating PnL: <strong id="ui-pos-pnl">$0.00</strong></span>
      </div>
    </div>
  </div>

  <!-- Execution Controls -->
  <div class="controls-footer">
    <button class="btn btn-buy" id="btn-buy" onclick="openPosition()">BUY LONG</button>
    <button class="btn btn-close" id="btn-close" onclick="closePosition()" disabled>CLOSE POSITION</button>
    <button class="btn btn-reset" onclick="resetChallenge()">RESET</button>
  </div>

  <script>
    // Initial State Configuration
    const CONFIG = {
      INITIAL_BALANCE: 1000.00,
      TARGET_EQUITY: 1100.00,
      HARD_STOP_EQUITY: 950.00,
      POSITION_SIZE_USD: 200.00, // Fixed position exposure per trade
      VOLATILITY: 0.004 // Simulated 0.4% micro volatility per tick
    };

    let state = {
      balance: CONFIG.INITIAL_BALANCE,
      equity: CONFIG.INITIAL_BALANCE,
      status: 'ACTIVE', // ACTIVE, PASSED, TERMINATED
      currentPrice: 0.042000, // Initial base simulated price
      position: null // { entryPrice, sizeUsd, unrealizedPnL }
    };

    // Initialize Telegram Mini App API
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Continuous Real-Time Price Simulation Engine (Random Walk)
    setInterval(() => {
      // Geometric Brownian Motion step
      const delta = (Math.random() - 0.495) * CONFIG.VOLATILITY; 
      state.currentPrice = Math.max(0.000001, state.currentPrice * (1 + delta));

      // Update position calculations tick-by-tick
      if (state.position) {
        const priceRatio = state.currentPrice / state.position.entryPrice;
        state.position.unrealizedPnL = (priceRatio - 1) * state.position.sizeUsd;
        state.equity = state.balance + state.position.unrealizedPnL;
      } else {
        state.equity = state.balance;
      }

      checkEvaluationRules();
      renderUI();
    }, 300); // Ticks every 300ms

    function openPosition() {
      if (state.status !== 'ACTIVE' || state.position) return;

      state.position = {
        entryPrice: state.currentPrice,
        sizeUsd: CONFIG.POSITION_SIZE_USD,
        unrealizedPnL: 0
      };
      renderUI();
    }

    function closePosition() {
      if (!state.position) return;

      // Realize PnL into Account Balance
      state.balance += state.position.unrealizedPnL;
      state.equity = state.balance;
      state.position = null;

      checkEvaluationRules();
      renderUI();
    }

    function checkEvaluationRules() {
      if (state.status !== 'ACTIVE') return;

      // Check Target Hit
      if (state.equity >= CONFIG.TARGET_EQUITY) {
        state.status = 'PASSED';
        if (state.position) closePosition();
      }
      // Check Hard Stop Hit
      else if (state.equity <= CONFIG.HARD_STOP_EQUITY) {
        state.status = 'TERMINATED';
        if (state.position) closePosition();
      }
    }

    function resetChallenge() {
      state.balance = CONFIG.INITIAL_BALANCE;
      state.equity = CONFIG.INITIAL_BALANCE;
      state.status = 'ACTIVE';
      state.position = null;
      renderUI();
    }

    function renderUI() {
      // Stats
      const equityEl = document.getElementById('ui-equity');
      equityEl.innerText = `$${state.equity.toFixed(2)}`;
      equityEl.className = 'stat-value ' + (state.equity >= CONFIG.INITIAL_BALANCE ? 'pnl-positive' : 'pnl-negative');

      // Status Badge
      const statusEl = document.getElementById('ui-status');
      statusEl.innerText = state.status;
      statusEl.className = `status-badge badge-${state.status.toLowerCase()}`;

      // Progress Bar Calculations ($100 profit target window)
      const progress = Math.min(100, Math.max(0, ((state.equity - CONFIG.INITIAL_BALANCE) / (CONFIG.TARGET_EQUITY - CONFIG.INITIAL_BALANCE)) * 100));
      document.getElementById('ui-progress-bar').style.width = `${progress}%`;
      document.getElementById('ui-progress-text').innerText = `${progress.toFixed(1)}%`;

      // Live Token Price
      document.getElementById('ui-token-price').innerText = `$${state.currentPrice.toFixed(6)}`;

      // Position Info
      const posStatusEl = document.getElementById('ui-pos-status');
      const posEntryEl = document.getElementById('ui-pos-entry');
      const posPnlEl = document.getElementById('ui-pos-pnl');
      const buyBtn = document.getElementById('btn-buy');
      const closeBtn = document.getElementById('btn-close');

      if (state.position) {
        posStatusEl.innerText = 'LONG (ACTIVE)';
        posStatusEl.style.color = 'var(--green)';
        posEntryEl.innerText = `$${state.position.entryPrice.toFixed(6)}`;
        
        const pnl = state.position.unrealizedPnL;
        posPnlEl.innerText = `${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}`;
        posPnlEl.className = pnl >= 0 ? 'pnl-positive' : 'pnl-negative';

        buyBtn.disabled = true;
        closeBtn.disabled = state.status !== 'ACTIVE';
      } else {
        posStatusEl.innerText = 'NONE';
        posStatusEl.style.color = 'var(--text-muted)';
        posEntryEl.innerText = '-';
        posPnlEl.innerText = '$0.00';
        posPnlEl.className = '';

        buyBtn.disabled = state.status !== 'ACTIVE';
        closeBtn.disabled = true;
      }
    }

    // Initial render call
    renderUI();
  </script>
</body>
</html>
