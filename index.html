<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonFund Evaluation Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 6px;
        }
        .header { text-align: center; margin-bottom: 6px; }
        .header h1 { color: #38bdf8; font-size: 16px; margin: 0; }
        .user-greeting {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            margin-top: 2px;
        }
        .test-bypass-btn {
            background-color: #f59e0b;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
        }
        .card {
            background: #151c2c;
            border: 1px solid #243049;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-title { font-size: 14px; font-weight: bold; color: #f8fafc; }
        .card-price { background: #0284c7; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .rules { font-size: 11px; color: #94a3b8; line-height: 1.4; margin-bottom: 8px; }
        .rules span { color: #e2e8f0; font-weight: 600; }
        .btn { background-color: #10b981; color: #000; border: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%; }

        /* COMPACT LIVE STATS HEADER */
        .compact-stats-bar {
            background: #151c2c;
            border: 1px solid #243049;
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .stat-item { display: flex; flex-direction: column; text-align: center; }
        .stat-lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .stat-val { font-weight: bold; color: #38bdf8; font-size: 12px; margin-top: 1px; transition: all 0.2s ease; }

        .reload-chart-btn {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* TRADE STATUS BANNER */
        .trade-status-banner {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 3px;
            border-radius: 4px;
            margin-bottom: 6px;
            background: #1e293b;
            color: #94a3b8;
        }

        /* DEX CONTAINER */
        .dex-frame-container {
            width: 100%;
            height: calc(100vh - 145px);
            min-height: 450px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #243049;
            margin-bottom: 6px;
            position: relative;
        }
        iframe {
            width: 100%;
            height: calc(100% + 38px);
            border: none;
        }

        .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .trade-btn { 
            background: #10b981; 
            color: #000; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
            active: opacity 0.7;
        }
        .sell-btn { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <!-- SECTION 1: PACKAGES LANDING -->
    <div id="landing-view">
        <div class="header">
            <h1>🚀 MoonFund Evaluation</h1>
            <div class="user-greeting" id="user-greeting">Loading...</div>
        </div>

        <button class="test-bypass-btn" onclick="launchDashboard(1000)">⚡ Test Bypass (Activate Terminal)</button>

        <div class="card">
            <div class="card-header">
                <span class="card-title">Micro Mooner ($1,000)</span>
                <span class="card-price">$15</span>
            </div>
            <div class="rules">
                • Target: <span>$100 (10%)</span> | Max Loss: <span>5% ($950 Stop)</span><br>
                • Fee: <span>Controlled execution</span>
            </div>
            <button class="btn" onclick="launchDashboard(1000)">Buy $1,000 Challenge</button>
        </div>
    </div>

    <!-- SECTION 2: TERMINAL -->
    <div id="dashboard-view" style="display:none;">
        
        <div class="compact-stats-bar">
            <button class="reload-chart-btn" onclick="resetDexList()">← Tokens</button>
            <div class="stat-item">
                <span class="stat-lbl">Equity</span>
                <span class="stat-val" id="val-equity">$1,000.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-lbl">Hard Stop</span>
                <span class="stat-val" id="val-stop" style="color: #ef4444;">$950.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-lbl">Target</span>
                <span class="stat-val" id="val-target" style="color: #10b981;">$1,100.00</span>
            </div>
        </div>

        <div class="trade-status-banner" id="status-banner">Ready to Trade</div>

        <div class="dex-frame-container">
            <iframe id="dex-iframe" src="https://dexscreener.com/solana?embed=1&theme=dark&trades=0&info=0"></iframe>
        </div>

        <div class="trade-grid">
            <button class="trade-btn" onclick="executeTrade('BUY')">BUY</button>
            <button class="trade-btn sell-btn" onclick="executeTrade('SELL')">SELL</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let account = { initialBalance: 1000, equity: 1000, target: 1100, hardStop: 950, status: "ACTIVE" };

        const user = tg.initDataUnsafe?.user;
        document.getElementById('user-greeting').innerText = user ? `@${user.username || user.first_name}` : "Trader";

        function setupBackButtonOverride() {
            window.history.pushState({ page: 'terminal' }, '', '');
            window.onpopstate = function () {
                resetDexList();
                window.history.pushState({ page: 'terminal' }, '', '');
            };

            tg.BackButton.show();
            tg.BackButton.onClick(() => { resetDexList(); });
        }

        window.onload = function() {
            const savedSession = localStorage.getItem('moonfund_active_session');
            if (savedSession) {
                account = JSON.parse(savedSession);
                showDashboardUI();
            }
        };

        function resetDexList() {
            document.getElementById('dex-iframe').src = "https://dexscreener.com/solana?embed=1&theme=dark&trades=0&info=0";
        }

        function launchDashboard(creditAmount) {
            account.initialBalance = creditAmount;
            account.equity = creditAmount;
            account.target = creditAmount * 1.10;
            account.hardStop = creditAmount * 0.95;
            account.status = "ACTIVE";

            localStorage.setItem('moonfund_active_session', JSON.stringify(account));
            showDashboardUI();
        }

        function showDashboardUI() {
            document.getElementById('landing-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            setupBackButtonOverride();
            updateDashboardUI();
        }

        function updateDashboardUI(lastChange = 0, type = '') {
            const equityEl = document.getElementById('val-equity');
            const bannerEl = document.getElementById('status-banner');

            equityEl.innerText = `$${account.equity.toFixed(2)}`;
            document.getElementById('val-stop').innerText = `$${account.hardStop.toFixed(2)}`;
            document.getElementById('val-target').innerText = `$${account.target.toFixed(2)}`;

            if (type !== '') {
                const isProfit = lastChange >= 0;
                bannerEl.innerText = `${type}: ${isProfit ? '+' : ''}$${lastChange.toFixed(2)} (${(lastChange / account.equity * 100).toFixed(2)}%)`;
                bannerEl.style.color = isProfit ? '#10b981' : '#ef4444';
                equityEl.style.color = isProfit ? '#10b981' : '#ef4444';
                
                setTimeout(() => {
                    equityEl.style.color = '#38bdf8';
                }, 400);
            }

            localStorage.setItem('moonfund_active_session', JSON.stringify(account));

            if (account.equity <= account.hardStop) {
                account.status = "TERMINATED";
                bannerEl.innerText = "🚨 MAX DRAWDOWN BREACHED! RESETTING...";
                bannerEl.style.color = "#ef4444";
                setTimeout(() => {
                    localStorage.removeItem('moonfund_active_session');
                    location.reload();
                }, 1500);
            } else if (account.equity >= account.target) {
                account.status = "PASSED";
                bannerEl.innerText = "🏆 EVALUATION PASSED! CONGRATULATIONS!";
                bannerEl.style.color = "#10b981";
            }
        }

        function executeTrade(type) {
            if (account.status !== "ACTIVE") return;

            // Simple active fluctuation logic: -$15 to +$30
            let pnl = type === 'BUY' ? (Math.random() * 40 - 15) : (Math.random() * 40 - 20);
            account.equity += pnl;

            updateDashboardUI(pnl, type);
        }
    </script>
</body>
</html>
